# Two jobs.
#
# hermetic: builds both venvs from uv.lock (the training group uses the CPU
# torch index), builds the client because
# test_security_regressions.py exercises the real SPA fallback in client/dist/,
# then runs every check-script through ci/test_scripts.py.
#
# lint: ruff check only. ruff format is deliberately not enforced; see the
# [tool.ruff.format] note in server/pyproject.toml.

name: ci

on:
  push:
  pull_request:

jobs:
  hermetic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Placeholders, not secrets. On the dev box these come from data/.env.
      # The security checks need them non-empty: login returns 503 with no
      # ADMIN_PASSWORD, and the stream-frame limits need an agent token to
      # reach the route at all.
      ADMIN_PASSWORD: ci-placeholder-not-a-secret
      AGENT_TOKEN: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Runtime venv (3.14, no torch)
        run: uv sync --frozen --python 3.14 --group dev

      - name: Training venv (3.12, CPU torch)
        env:
          UV_PROJECT_ENVIRONMENT: .venv-train
        run: uv sync --frozen --python 3.12 --group train

      - name: Check-scripts
        run: .venv/bin/python -m pytest -m "not local_data"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.14 --group dev
      - name: ruff check
        run: .venv/bin/ruff check .

  # The C++ capture agent: format check, then the test suite under the
  # plain, ASan+UBSan and TSan presets. ffmpeg is installed so the real
  # lavfi capture test runs instead of skipping.
  cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-cpp
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev nlohmann-json3-dev catch2 unzip clang-format ffmpeg
      - name: ONNX Runtime
        run: scripts/fetch-onnxruntime.sh
      - name: clang-format
        run: clang-format --dry-run -Werror src/*.cpp src/*.hpp tests/*.cpp tests/*.hpp
      - name: Release
        run: cmake --preset default && cmake --build --preset default -j && ctest --preset default
      - name: ASan+UBSan
        run: cmake --preset asan && cmake --build --preset asan -j && ctest --preset asan
      - name: TSan
        run: cmake --preset tsan && cmake --build --preset tsan -j && ctest --preset tsan
