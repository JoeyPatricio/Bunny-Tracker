# Two jobs, per Phase 1 of docs/upgrade-plan.md.
#
# hermetic: builds both venvs from the pinned requirements files (the training
# one from requirements-train-cpu.txt, so a GPU-less runner does not pull the
# CUDA torch wheel and its nvidia_* packages), builds the client because
# test_security_regressions.py exercises the real SPA fallback in client/dist/,
# then runs every check-script through ci/test_scripts.py.
#
# lint: ruff check only. ruff format is deliberately not enforced; see the
# [tool.ruff.format] note in server_py/pyproject.toml.

name: ci

on:
  push:
  pull_request:

jobs:
  hermetic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_py
    env:
      # Placeholders, not secrets. On the dev box these come from server/.env.
      # The security checks need them non-empty: login returns 503 with no
      # ADMIN_PASSWORD, and the stream-frame limits need an agent token to
      # reach the route at all.
      ADMIN_PASSWORD: ci-placeholder-not-a-secret
      AGENT_TOKEN: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Runtime venv (3.14, no torch)
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Training venv (3.12, CPU torch)
        run: |
          uv venv --python 3.12 .venv-train
          uv pip install --python .venv-train/bin/python -r requirements-train-cpu.txt

      - name: Check-scripts
        run: uvx --from pytest==9.1.1 pytest -m "not local_data"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uvx ruff@0.16.10 check .
