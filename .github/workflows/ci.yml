# Two jobs.
#
# hermetic: builds both venvs from uv.lock (the training group uses the CPU
# torch index), builds the client because
# test_security_regressions.py exercises the real SPA fallback in client/dist/,
# then runs every check-script through ci/test_scripts.py.
#
# lint: ruff check only. ruff format is deliberately not enforced; see the
# [tool.ruff.format] note in server_py/pyproject.toml.

name: ci

on:
  push:
  pull_request:

jobs:
  hermetic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_py
    env:
      # Placeholders, not secrets. On the dev box these come from server/.env.
      # The security checks need them non-empty: login returns 503 with no
      # ADMIN_PASSWORD, and the stream-frame limits need an agent token to
      # reach the route at all.
      ADMIN_PASSWORD: ci-placeholder-not-a-secret
      AGENT_TOKEN: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Runtime venv (3.14, no torch)
        run: uv sync --frozen --python 3.14 --group dev

      - name: Training venv (3.12, CPU torch)
        env:
          UV_PROJECT_ENVIRONMENT: .venv-train
        run: uv sync --frozen --python 3.12 --group train

      - name: Check-scripts
        run: .venv/bin/python -m pytest -m "not local_data"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --python 3.14 --group dev
      - name: ruff check
        run: .venv/bin/ruff check .
