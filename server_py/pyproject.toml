[project]
name = "bunny-tracker"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
    "slowapi==0.1.10",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "onnxruntime==1.29.0",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.5.2",
]

[dependency-groups]
train = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "timm==1.0.29",
    "onnx==1.22.0",
    "onnxscript==0.7.2",
    "scikit-learn==1.9.0",
    "albumentations==2.0.8",
    "matplotlib==3.11.2",
]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false
default-groups = []

[tool.uv.dependency-groups]
train = {requires-python = "==3.12.*"}

# The training group is CPU-only. The runtime install never includes torch.
[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".venv-train", "client", "server_py/models"]

[tool.ruff.lint]
# Deliberately narrow to start. A broad rule set on an existing codebase
# produces a wall of findings nobody reads. Widen once this is clean.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length: the comment style here runs long on purpose
    "E402",  # module import not at top: every script does sys.path.insert first
]

[tool.ruff.format]
# Not enabled in CI yet. Running the formatter over this codebase would rewrite
# the hand-aligned comment blocks that carry most of its documentation, in one
# unreviewable diff. If it is ever turned on, land it as its own commit with no
# logic changes.
quote-style = "preserve"

[tool.pytest.ini_options]
# Points at ci/ ONLY. server_py/tests/ holds plain check-scripts with
# module-level `async def test_*` functions; if pytest collected those without
# an async plugin it would report them as skips that read like passes, which is
# worse than not collecting them at all. ci/test_scripts.py runs them as
# subprocesses instead.
testpaths = ["ci"]
markers = [
    "local_data: needs real recordings or a trained model on disk; not run in CI",
]
