# Copy to /etc/cloudflared/config.yml and replace <TUNNEL-ID> with the
# existing tunnel's ID (the name of its credentials JSON). Reusing the PC's
# tunnel keeps DNS untouched.
tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json
ingress:
  - hostname: bunny-tracker.app
    service: http://127.0.0.1:3001
  - service: http_status:404
