# Copy to /etc/cloudflared/config.yml. Replace <TUNNEL-ID> with the tunnel's
# ID (the name of its credentials JSON) and <your-domain> with the hostname
# routed to the tunnel.
tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json
ingress:
  - hostname: <your-domain>
    service: http://127.0.0.1:3001
  - service: http_status:404
