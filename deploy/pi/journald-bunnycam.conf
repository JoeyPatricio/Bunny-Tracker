# Install as /etc/systemd/journald.conf.d/bunnycam.conf. This caps the whole
# system journal, not just the bunnycam units. That is intended on a Pi that
# runs nothing else. The agent logs a line per sampled frame, so bound the
# journal by size and age.
[Journal]
Storage=persistent
SystemMaxUse=200M
MaxRetentionSec=1month
